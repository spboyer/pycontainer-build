[project]
name = "lockdemo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx[socks]>=0.27",
    "colorama>=0.4; sys_platform == 'win32'",
    "iniconfig==2.0.0; python_version < '3.12'",
    "iniconfig==2.1.0; python_version >= '3.12'",
]

[dependency-groups]
dev = ["pluggy>=1"]

