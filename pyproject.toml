[project]
name = "pycontainer-build"
version = "0.3.1"
description = "Experimental .NET-style native OCI image builder for Python projects (no Docker daemon, no Dockerfile)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "pycontainer contributors" }
]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not registry_integration"]
markers = [
  "registry_integration: requires external registry access and pulls real base-image layers",
]

[project.scripts]
pycontainer = "pycontainer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
