name: Runtime image check

# Real OCI import and container startup on native runners. Each target must
# produce passing evidence; a missing, skipped or failed target fails the gate.
on:
  workflow_call:
    inputs:
      check-index:
        description: Check a multi-platform OCI index on each native target
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      check-index:
        description: Check a multi-platform OCI index on each native target
        type: boolean
        default: false
      windows-squash-equivalence:
        description: Compare Windows-built plain and squashed layouts on Linux
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  startup:
    name: OCI import and startup (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs['check-index'] && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Skopeo
        timeout-minutes: 5
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q skopeo
          fi
          skopeo --version
      - name: Check Skopeo OCI reference selection
        env:
          PYTHONPATH: src
        run: python tests/test_skopeo_tag_refs.py
      - name: Record an incomplete check until the script finishes
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p runtime-evidence
          printf '{"schema": 1, "status": "failed", "target_platform": "%s", "error": "check did not complete"}\n' \
            "$TARGET_PLATFORM" > runtime-evidence/${{ matrix.slug }}.json
      - name: Build, import and start the image
        env:
          PYTHONPATH: src
        run: >-
          timeout 600 python scripts/check_runtime_image.py
          --base-image python:3.11-slim
          --platform ${{ matrix.platform }}
          --timeout 300
          --evidence runtime-evidence/${{ matrix.slug }}.json
      - name: Build, import and start a multi-platform image index
        if: ${{ inputs['check-index'] }}
        env:
          PYTHONPATH: src
        run: >-
          timeout 600 python scripts/check_runtime_image.py
          --base-image python:3.11-slim
          --platform ${{ matrix.platform }}
          --multi-platform-index
          --timeout 300
          --evidence index-runtime-evidence/${{ matrix.slug }}.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-${{ matrix.slug }}
          path: runtime-evidence/${{ matrix.slug }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Upload index evidence
        if: ${{ always() && inputs['check-index'] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-runtime-evidence-${{ matrix.slug }}
          path: index-runtime-evidence/${{ matrix.slug }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Check out exact PR head for CMD-only import
        if: github.event_name == 'pull_request' && matrix.slug == 'linux-amd64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: cmd-only-pr-head
          persist-credentials: false
      - name: Start shell- and exec-form CMD-only imports
        if: github.event_name == 'pull_request' && matrix.slug == 'linux-amd64'
        working-directory: cmd-only-pr-head
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: src
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          env HOME="$(mktemp -d)" GITHUB_SHA="$PR_HEAD" \
            timeout 600 python scripts/check_runtime_image.py --cmd-only \
            --platform linux/amd64 --evidence ../cmd-only-evidence.json
      - name: Upload CMD-only evidence
        if: always() && github.event_name == 'pull_request' && matrix.slug == 'linux-amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmd-only-runtime-evidence
          path: cmd-only-evidence.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  gate:
    name: Runtime evidence gate
    needs: startup
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download evidence
        id: download
        # A failed download is reported by the verifier rather than skipping it.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-evidence-linux-*
          path: runtime-evidence
      - name: Verify every required target passed
        run: >-
          python3 scripts/verify_runtime_evidence.py
          --evidence-dir runtime-evidence
          --require linux/amd64
          --require linux/arm64
          --commit ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --summary runtime-evidence-summary.md
          ${{ steps.download.outcome != 'success' && '--error "evidence download did not succeed"' || '' }}
          ${{ needs.startup.result != 'success' && format('--error "startup jobs in this attempt reported {0}"', needs.startup.result) || '' }}
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-summary
          path: runtime-evidence-summary.md
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  windows-squash-build:
    name: Build plain and squashed layouts on Windows
    if: github.event_name == 'workflow_dispatch' && inputs['windows-squash-equivalence']
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build both layouts with an isolated home
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          HOME: '${{ runner.temp }}\squash-home'
          USERPROFILE: '${{ runner.temp }}\squash-home'
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw "Checkout does not match the workflow commit."
          }
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          python scripts/check_squash_equivalence.py --build-only "$env:RUNNER_TEMP\squash-layouts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows-built layouts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-squash-layouts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squash-layouts
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  windows-squash-verify:
    name: Verify Windows-built layouts on Linux
    if: github.event_name == 'workflow_dispatch' && inputs['windows-squash-equivalence']
    needs: windows-squash-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Skopeo
        timeout-minutes: 5
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q skopeo
          fi
          skopeo --version
      - name: Download the exact Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows-squash-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/squash-layouts
          digest-mismatch: error
      - name: Import, run and compare both layouts
        env:
          PYTHONPATH: src
          SQUASH_ARTIFACT_ID: ${{ needs.windows-squash-build.outputs.artifact-id }}
          SQUASH_ARTIFACT_DIGEST: ${{ needs.windows-squash-build.outputs.artifact-digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 900 python scripts/check_squash_equivalence.py \
            --check-only "$RUNNER_TEMP/squash-layouts" \
            --timeout 300 --evidence "$RUNNER_TEMP/squash-evidence.json"
          cat "$RUNNER_TEMP/squash-evidence.json"
      - name: Upload runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-squash-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squash-evidence.json
          if-no-files-found: error
          retention-days: 90
