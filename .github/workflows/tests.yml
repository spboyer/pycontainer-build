name: Tests and performance baseline

# The pinned Node 24 actions require Actions Runner 2.327.1 or later.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-registry-integration:
        description: Run tests that pull real registry layers
        required: false
        type: boolean
        default: false
      run-benchmarks:
        description: Record the synthetic build performance baseline
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Sync locked test dependencies
        run: uv sync --locked --group test
      - name: Run hermetic tests
        env:
          PYTHONPATH: src
        run: uv run --locked --group test python -m pytest tests -q -m "not registry_integration"

  # Evidence for #148, not a gate: populate a --cache-dir on each OS, then
  # restore every OS's cache into another absolute path and checkout location.
  cache-portability-populate:
    name: Cache portability populate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Populate a cache from the example app
        shell: bash
        run: >
          python scripts/check_cache_portability.py populate
          --context examples/fastapi-app
          --cache-dir "$RUNNER_TEMP/portability/cache"
          --output-dir "$RUNNER_TEMP/source-output"
          --report "$RUNNER_TEMP/portability/report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-portability-${{ runner.os }}
          path: ${{ runner.temp }}/portability
          retention-days: 7

  cache-portability-verify:
    name: Cache portability restore (${{ matrix.os }})
    needs: cache-portability-populate
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cache-portability-*
          path: ${{ runner.temp }}/restored
      - name: Restore each OS cache into a relocated checkout
        shell: bash
        run: |
          status=0
          for source in Linux Windows; do
            checkout="$RUNNER_TEMP/relocated-$source/checkout/app"
            mkdir -p "$(dirname "$checkout")"
            cp -Rp examples/fastapi-app "$checkout"
            python scripts/check_cache_portability.py verify \
              --context "$checkout" \
              --cache-dir "$RUNNER_TEMP/restored/cache-portability-$source/cache" \
              --output-dir "$RUNNER_TEMP/relocated-$source/output" \
              --source-report "$RUNNER_TEMP/restored/cache-portability-$source/report.json" \
              --report "$RUNNER_TEMP/relocated-$source/report.json" || status=1
          done
          exit $status

  package-smoke:
    name: Isolated wheel and sdist smoke test
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Sync locked build dependencies
        run: uv sync --locked --group build
      - name: Build and install distributions in isolated environments
        run: uv run --locked --group build python scripts/smoke_distributions.py

  poetry-plugin:
    name: Poetry plugin contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Sync locked Poetry plugin dependencies
        run: uv sync --locked --group test --group build --group poetry-plugin
      - name: Install Poetry plugin without resolving dependencies
        run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e plugins/poetry-pycontainer
      - name: Test Poetry registration, options, and CLI smoke
        run: uv run --locked --group test --group build --group poetry-plugin python -m pytest plugins/poetry-pycontainer/tests -q

  hatch-plugin:
    name: Hatch plugin contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Sync locked Hatch plugin dependencies
        run: uv sync --locked --group test --group build --group hatch-plugin
      - name: Install Hatch plugin without resolving dependencies
        run: uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e plugins/hatch-pycontainer
      - name: Test Hatch registration, options, and CLI smoke
        run: uv run --locked --group test --group build --group hatch-plugin python -m pytest plugins/hatch-pycontainer/tests -q

  vscode-extension:
    name: VS Code extension contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/vscode-pycontainer/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Install the core for the extension smoke test
        run: uv sync --locked
      - name: Install extension development dependencies
        working-directory: plugins/vscode-pycontainer
        run: uv run --locked npm ci
      - name: Compile extension
        working-directory: plugins/vscode-pycontainer
        run: uv run --locked npm run compile
      - name: Lint extension
        working-directory: plugins/vscode-pycontainer
        run: uv run --locked npm run lint
      - name: Test extension commands and core integration
        working-directory: plugins/vscode-pycontainer
        run: uv run --locked npm test
      - name: Package extension
        working-directory: plugins/vscode-pycontainer
        run: uv run --locked npm run package

  reusable-workflow-smoke:
    name: Reusable workflow source-install smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pycontainer-build.yml
    with:
      python-version: "3.11"
      tag: smoke:local
      context: examples/fastapi-app
      push: false
      include-deps: false
      dry-run: true
    permissions:
      contents: read
      packages: write

  runtime-check:
    name: Real OCI runtime check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    uses: ./.github/workflows/runtime-check.yml
    permissions:
      contents: read

  registry-integration:
    name: Opt-in registry integration tests
    if: github.event_name == 'workflow_dispatch' && inputs['run-registry-integration']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Sync locked test dependencies
        run: uv sync --locked --group test
      - name: Run registry-pulling tests
        env:
          PYTHONPATH: src
        run: uv run --locked --group test python -m pytest tests -q -o addopts= -m registry_integration

  performance-baseline:
    name: Synthetic performance baseline
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs['run-benchmarks'])
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Record repeatable build measurements
        run: python benchmarks/run_build_benchmarks.py --repetitions 3 --files 1000 --file-bytes 1024 --output benchmark-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}
          path: benchmark-results.json
          retention-days: 90
