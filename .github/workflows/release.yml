name: Release

# The pinned Node 24 actions require Actions Runner 2.327.1 or later.
on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - name: Sync locked test dependencies
        run: uv sync --locked --group test
      
      - name: Run tests
        run: uv run --locked --group test python -m pytest tests/ -v -m "not registry_integration"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - name: Sync locked build dependencies
        run: uv sync --locked --group build
      
      - name: Build package
        run: uv run --locked --group build python -m build --no-isolation
      
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  runtime:
    name: Target runtime verification
    needs: test
    uses: ./.github/workflows/runtime-check.yml
    permissions:
      contents: read

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Default needs semantics: a failed, skipped or cancelled runtime gate blocks the release.
    needs: [build, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for changelog generation
      
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      
      - name: Download runtime evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-evidence-linux-*
          path: runtime-evidence/

      - name: Verify release-attempt runtime evidence
        run: >-
          python3 scripts/verify_runtime_evidence.py
          --evidence-dir runtime-evidence
          --require linux/amd64
          --require linux/arm64
          --commit ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --summary runtime-evidence/runtime-evidence-summary.md
      
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # Generate changelog
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt
          printf '\n' >> changelog.txt
          cat runtime-evidence/runtime-evidence-summary.md >> changelog.txt
          echo "Generated changelog for release"
      
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: changelog.txt
          files: |
            dist/*.tar.gz
            dist/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Uncomment this job when ready to publish to PyPI
