name: Build Container with pycontainer

# The pinned Node 24 actions require Actions Runner 2.327.1 or later.

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string
      tag:
        description: 'Container image tag'
        required: true
        type: string
      base-image:
        description: 'Base image for container'
        required: false
        default: 'python:3.11-slim'
        type: string
      context:
        description: 'Build context directory'
        required: false
        default: '.'
        type: string
      push:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean
      dry-run:
        description: 'Preview the build without pulling images or writing output'
        required: false
        default: false
        type: boolean
      include-deps:
        description: 'Include dependencies from venv/requirements.txt'
        required: false
        default: true
        type: boolean
      sbom:
        description: 'SBOM format: spdx or cyclonedx; empty disables SBOM'
        required: false
        default: ''
        type: string
      registry:
        description: 'Container registry (default: ghcr.io)'
        required: false
        default: 'ghcr.io'
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username (optional if using GITHUB_TOKEN)'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password (optional if using GITHUB_TOKEN)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the immutable pycontainer-build workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pycontainer-build
          persist-credentials: false
      
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      
      - name: Install pycontainer-build
        run: python -m pip install --no-deps ./.pycontainer-build
      
      - name: Build container image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ inputs.tag }}
          BASE_IMAGE: ${{ inputs.base-image }}
          CONTEXT_DIR: ${{ inputs.context }}
          INCLUDE_DEPS: ${{ inputs.include-deps }}
          SBOM_FORMAT: ${{ inputs.sbom }}
          PUSH_IMAGE: ${{ inputs.push }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          case "$SBOM_FORMAT" in
            ""|spdx|cyclonedx) ;;
            *) echo "::error::Unsupported SBOM format: $SBOM_FORMAT"; exit 2 ;;
          esac

          args=(pycontainer build --tag "$IMAGE_TAG" --context "$CONTEXT_DIR" --base-image "$BASE_IMAGE")
          
          if [ "$INCLUDE_DEPS" = "true" ]; then
            args+=(--include-deps)
          fi
          
          if [ -n "$SBOM_FORMAT" ]; then
            args+=(--sbom "$SBOM_FORMAT")
          fi
          
          if [ "$PUSH_IMAGE" = "true" ]; then
            args+=(--push)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          
          args+=(--verbose)
          
          echo "Executing: ${args[*]}"
          "${args[@]}"
      
      - name: Generate build summary
        if: always()
        env:
          SBOM_FORMAT: ${{ inputs.sbom }}
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Image**: \`${{ inputs.base-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: \`${{ inputs.python-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Context**: \`${{ inputs.context }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed**: ${{ inputs.push }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$SBOM_FORMAT" ]; then
            echo "- **SBOM**: \`$SBOM_FORMAT\`" >> "$GITHUB_STEP_SUMMARY"
          fi
